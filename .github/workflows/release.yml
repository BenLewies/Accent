name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Keyed by ref so a tagged release never cancels a master build (or vice versa).
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: package-linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libevdev-dev \
            libwayland-dev \
            libfontconfig-dev \
            libasound2-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --release --locked

      - name: Dependency notices
        run: python3 scripts/bundle_notices.py --target x86_64-unknown-linux-gnu --output RUST_DEPENDENCY_LICENSES.txt

      - name: Package
        run: |
          strip target/release/accent || true
          STAGE=accent-linux-x86_64
          mkdir -p "$STAGE"
          cp target/release/accent "$STAGE/"
          cp dist/linux/accent.service "$STAGE/"
          cp dist/linux/accent.desktop "$STAGE/"
          cp dist/linux/60-accent.rules "$STAGE/"
          cp assets/icon-app.svg "$STAGE/accent.svg"
          cp assets/icon-app-256.png "$STAGE/accent-256.png"
          cp assets/icon-app-512.png "$STAGE/accent-512.png"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md "$STAGE/"
          cp RUST_DEPENDENCY_LICENSES.txt "$STAGE/"
          tar -czf accent-linux-x86_64.tar.gz "$STAGE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64
          path: accent-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: package-macos-universal
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output accent-universal \
            target/aarch64-apple-darwin/release/accent \
            target/x86_64-apple-darwin/release/accent
          lipo -info accent-universal

      - name: Dependency notices
        run: |
          python3 scripts/bundle_notices.py --target aarch64-apple-darwin --output notices-arm64.txt
          python3 scripts/bundle_notices.py --target x86_64-apple-darwin --output notices-x86_64.txt
          cat notices-arm64.txt notices-x86_64.txt > RUST_DEPENDENCY_LICENSES.txt

      - name: Package .app
        run: |
          APP=Accent.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp accent-universal "$APP/Contents/MacOS/accent"
          chmod +x "$APP/Contents/MacOS/accent"
          cp dist/macos/Accent.app/Contents/Info.plist "$APP/Contents/Info.plist"
          cp dist/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/"
          cp RUST_DEPENDENCY_LICENSES.txt "$APP/Contents/Resources/"
          # Ad-hoc sign the bundle. Without a bundle-level signature TCC has
          # no stable code requirement to bind the Accessibility grant to, so
          # the toggle never takes effect (and duplicate entries pile up).
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP"
          tar -czf Accent-macos-universal.tar.gz "$APP"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal
          path: Accent-macos-universal.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum accent-linux-x86_64.tar.gz Accent-macos-universal.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/accent-linux-x86_64.tar.gz
            artifacts/Accent-macos-universal.tar.gz

      - name: List artifacts
        run: ls -la artifacts/

      # ---- tagged release (vX.Y.Z): the stable download users get ----
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Accent ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<EOF

          ## Install

          \`\`\`bash
          # Linux x86_64 (including Arch / Omarchy): the installer verifies
          # the asset against SHA256SUMS before installing it
          git clone --branch ${GITHUB_REF_NAME} --depth 1 https://github.com/${{ github.repository }}
          ACCENT_VERSION=${GITHUB_REF_NAME} Accent/dist/linux/install.sh

          # macOS (universal)
          git clone --branch ${GITHUB_REF_NAME} --depth 1 https://github.com/${{ github.repository }}
          ACCENT_VERSION=${GITHUB_REF_NAME} Accent/dist/macos/install.sh
          \`\`\`

          Omarchy bar controls are installed separately:

          \`\`\`bash
          omarchy plugin add https://github.com/${{ github.repository }} --enable
          \`\`\`

          See the README for input-device permissions, dependencies and removal.
          No Accent AUR package is currently published.

          ## Verify an asset

          \`\`\`bash
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify accent-linux-x86_64.tar.gz --repo ${{ github.repository }}
          \`\`\`

          | File | Platform |
          |------|----------|
          | \`accent-linux-x86_64.tar.gz\` | Linux x86_64 |
          | \`Accent-macos-universal.tar.gz\` | macOS universal (arm64 + x86_64) |
          | \`SHA256SUMS\` | Checksums of the two archives |
          EOF
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/accent-linux-x86_64.tar.gz
            artifacts/Accent-macos-universal.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- rolling build from master ----
      - name: Publish continuous release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: continuous
          name: continuous
          prerelease: true
          # Stable tagged releases stay "Latest"; this is the rolling build.
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Manually requested preview build from the reviewed commit.

            For the stable download see the [latest release](https://github.com/${{ github.repository }}/releases/latest).

            **Commit:** ${{ github.sha }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Assets
            | File | Platform |
            |------|----------|
            | `accent-linux-x86_64.tar.gz` | Linux x86_64 |
            | `Accent-macos-universal.tar.gz` | macOS universal (arm64 + x86_64) |

            ### Install
            Rolling builds are for testing. From a clone of `master`:
            ```bash
            ACCENT_VERSION=continuous ./dist/linux/install.sh   # Linux
            ACCENT_VERSION=continuous ./dist/macos/install.sh   # macOS
            ```
            Verify an asset with `sha256sum -c --ignore-missing SHA256SUMS` or
            `gh attestation verify <asset> --repo ${{ github.repository }}`.
            For the stable install see the [README](https://github.com/${{ github.repository }}#install).
          files: |
            artifacts/accent-linux-x86_64.tar.gz
            artifacts/Accent-macos-universal.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
